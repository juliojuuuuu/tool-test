<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Music Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-10">
<div class="max-w-5xl mx-auto">
    <header class="mb-8 flex justify-between items-end">
        <div>
            <h1 class="text-3xl md:text-4xl font-black text-cyan-400">MUSIC TOOL LINUX</h1>
            <p class="text-slate-400">Sauvegarde locale sur <span class="font-mono text-cyan-500">data.json</span></p>
        </div>
        <div id="syncStatus" class="text-xs text-slate-300 font-mono">● Initialisation</div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <section class="space-y-6">
            <div class="glass p-6 rounded-3xl shadow-2xl">
                <h2 class="text-xl font-bold mb-4">Ajouter un artiste</h2>
                <input id="artistName" type="text" placeholder="Nom" class="w-full mb-3 p-3 rounded-xl bg-slate-900 border border-slate-700 focus:border-cyan-500 outline-none" />
                <input id="artistLink" type="url" placeholder="Lien URL" class="w-full mb-4 p-3 rounded-xl bg-slate-900 border border-slate-700 focus:border-cyan-500 outline-none" />
                <button onclick="addArtist()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-xl">Ajouter</button>
            </div>

            <div class="glass p-6 rounded-3xl h-64 flex flex-col items-center">
                <h2 class="text-sm font-bold uppercase text-slate-500 mb-2">Progression</h2>
                <canvas id="statsChart"></canvas>
            </div>
        </section>

        <section class="lg:col-span-2 glass rounded-3xl shadow-2xl overflow-hidden">
            <div class="max-h-[600px] overflow-y-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-slate-800/90 text-slate-400 text-xs uppercase font-bold">
                        <tr>
                            <th class="p-4 w-16 text-center">État</th>
                            <th class="p-4">Artiste</th>
                            <th class="p-4">Source</th>
                            <th class="p-4 text-center">Supp</th>
                        </tr>
                    </thead>
                    <tbody id="artistList" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </section>
    </div>
</div>

<script>
    let artists = [];
    let myChart;

    function setStatus(text, colorClass) {
        const status = document.getElementById('syncStatus');
        status.innerText = text;
        status.className = `text-xs font-mono ${colorClass}`;
    }

    async function loadFromServer() {
        setStatus('○ Chargement...', 'text-yellow-400');

        try {
            const res = await fetch('/api/artists');
            const payload = await res.json();
            if (!res.ok) throw new Error(payload.error || 'Erreur de chargement');

            artists = Array.isArray(payload) ? payload : [];
            renderUI(false);
            setStatus('● Synchronisé', 'text-green-400');
        } catch (error) {
            console.error(error);
            setStatus('✖ Erreur chargement', 'text-red-400');
        }
    }

    async function saveToServer() {
        setStatus('○ Sauvegarde...', 'text-yellow-400');

        try {
            const res = await fetch('/api/artists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(artists)
            });

            const payload = await res.json();
            if (!res.ok) throw new Error(payload.detail || payload.error || 'Erreur de sauvegarde');
            setStatus('● Synchronisé', 'text-green-400');
        } catch (error) {
            console.error(error);
            setStatus('✖ Sauvegarde échouée', 'text-red-400');
        }
    }

    function renderUI(shouldSave = true) {
        const list = document.getElementById('artistList');
        list.innerHTML = '';

        artists.forEach((artist, index) => {
            list.innerHTML += `
                <tr class="hover:bg-white/5">
                    <td class="p-4 text-center"><input type="checkbox" ${artist.done ? 'checked' : ''} onchange="toggleDone(${index})" class="w-5 h-5 accent-cyan-500"></td>
                    <td class="p-4 ${artist.done ? 'line-through text-slate-500' : 'text-slate-100'}">${artist.name}</td>
                    <td class="p-4"><a class="text-cyan-500 hover:underline" href="${artist.link}" target="_blank">URL ↗</a></td>
                    <td class="p-4 text-center"><button onclick="deleteArtist(${index})" class="text-red-500 hover:text-red-400">✕</button></td>
                </tr>`;
        });

        updateChart();
        if (shouldSave) saveToServer();
    }

    function addArtist() {
        const name = document.getElementById('artistName');
        const link = document.getElementById('artistLink');

        if (!name.value.trim() || !link.value.trim()) return;

        artists.push({ name: name.value.trim(), link: link.value.trim(), done: false });
        name.value = '';
        link.value = '';
        renderUI();
    }

    function toggleDone(index) {
        artists[index].done = !artists[index].done;
        renderUI();
    }

    function deleteArtist(index) {
        if (!confirm('Supprimer cet artiste ?')) return;
        artists.splice(index, 1);
        renderUI();
    }

    function updateChart() {
        const done = artists.filter((a) => a.done).length;
        const total = artists.length;
        const data = {
            labels: ['Fait', 'Reste'],
            datasets: [{ data: [done, Math.max(total - done, 0)], backgroundColor: ['#06b6d4', '#1e293b'], borderWidth: 0 }]
        };

        if (myChart) {
            myChart.data = data;
            myChart.update();
            return;
        }

        myChart = new Chart(document.getElementById('statsChart'), {
            type: 'doughnut',
            data,
            options: { cutout: '80%', plugins: { legend: { display: false } } }
        });
    }

    loadFromServer();
</script>
</body>
</html>
